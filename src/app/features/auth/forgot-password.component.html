<main class="min-h-screen bg-slate-50 px-4 py-8 text-slate-950 transition-colors dark:bg-slate-950 dark:text-slate-100">
  <section class="mx-auto flex min-h-[calc(100vh-4rem)] w-full max-w-md items-center justify-center">
    <div class="w-full rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/80 sm:p-8">
      <a routerLink="/login" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 transition hover:text-slate-950 dark:text-slate-400 dark:hover:text-white">
        <svg lucideIcon="arrow-left" class="size-4"></svg>
        Back to login
      </a>

      <div class="mt-8">
        <div class="flex size-11 items-center justify-center rounded-lg bg-slate-950 text-white dark:bg-white dark:text-slate-950">
          <svg lucideIcon="key-round" class="size-5"></svg>
        </div>
        <h1 class="mt-5 text-2xl font-semibold">Reset password</h1>
        <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">Send a password reset link to your workspace account email.</p>
      </div>

      <form class="mt-8 grid gap-4" [formGroup]="form" (ngSubmit)="sendReset()">
        <label class="grid gap-2 text-sm font-medium">
          Email
          <div class="flex h-11 items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 transition focus-within:border-teal-500 focus-within:ring-2 focus-within:ring-teal-500/20 dark:border-slate-800 dark:bg-slate-950">
            <svg lucideIcon="mail" class="size-4 text-slate-400"></svg>
            <input formControlName="email" type="email" autocomplete="email" class="w-full bg-transparent text-sm outline-none" placeholder="raj@startup.com">
          </div>
        </label>

        @if (errorMessage) {
          <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700 dark:border-rose-400/20 dark:bg-rose-400/10 dark:text-rose-200">
            {{ errorMessage }}
          </div>
        }

        @if (successMessage) {
          <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700 dark:border-emerald-400/20 dark:bg-emerald-400/10 dark:text-emerald-200">
            {{ successMessage }}
          </div>
        }

        <button
          type="submit"
          class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-slate-950 px-4 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-white dark:text-slate-950 dark:hover:bg-slate-200"
          [disabled]="isSubmitting"
        >
          @if (isSubmitting) {
            <svg lucideIcon="loader-circle" class="size-4 animate-spin"></svg>
          } @else {
            <svg lucideIcon="mail" class="size-4"></svg>
          }
          Send Reset Link
        </button>
      </form>
    </div>
  </section>
</main>

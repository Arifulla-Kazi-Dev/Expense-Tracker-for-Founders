name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build:github

      - name: Prepare static Pages shell
        run: |
          APP_DIR="dist/expense-tracker-founders/browser"
          cp "$APP_DIR/index.csr.html" "$APP_DIR/index.html"
          cp "$APP_DIR/index.html" "$APP_DIR/404.html"
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/expense-tracker-founders/browser';
          const cssFile = fs.readdirSync(path).find((file) => /^styles-.+\.css$/.test(file));

          if (!cssFile) {
            throw new Error('Unable to find compiled stylesheet for Pages publish.');
          }

          const css = fs.readFileSync(`${path}/${cssFile}`, 'utf8');
          const cssLink = `<link rel="stylesheet" href="${cssFile}">`;

          for (const file of ['index.html', '404.html']) {
            const htmlPath = `${path}/${file}`;
            const html = fs.readFileSync(htmlPath, 'utf8').replace(cssLink, `<style>${css}</style>`);
            fs.writeFileSync(htmlPath, html);
          }
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/expense-tracker-founders/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
